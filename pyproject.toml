[project]
name = "wallet-passphrase-recovery"
version = "0.2.0"
description = "Recover a forgotten SLIP-39 or BIP-39 wallet passphrase from a list of words you think it contains"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "eth-account>=0.14.0",
    "python-dotenv>=1.2.4",
    "shamir-mnemonic>=0.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
